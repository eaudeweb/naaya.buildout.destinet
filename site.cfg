# destinet.eu: ZEO, Zope instances behind haproxy; secrets in secret.cfg
[site]
versions = ${directory}/versions.cfg
develop =
    ${directory}/src/NaayaBundles-DESTINET
eggs =
    ${naaya:eggs}
    destinet.extra
    edw.productsinfo
    naaya.content.bestpractice
    naaya.content.certificate
    naaya.content.goodpracticebusiness
    naaya.content.hexfolder
    naaya.envirowindows
    naayabundles_destinet
    Products.NaayaCalendar
    Products.NaayaContent.NyPublication
    Products.NaayaLinkChecker
zcml =
    ${naaya:zcml}
    edw.productsinfo
    naaya.content.bestpractice
    naaya.content.certificate
    naaya.content.goodpracticebusiness
    naaya.content.hexfolder
    Products.NaayaContent.NyPublication
    Products.EnviroWindows
    destinet.extra
    naayabundles_destinet
environment =
    AKISMET_API_KEY b2e6ebf3c311
    PYTHON_EGG_CACHE ${directory}/var/egg-cache
    NAAYA_MAIL_QUEUE ${directory}/var/naaya-mail-queue
    SITES_LOG_PATH ${directory}/var/bulk_mail_archive
    JSON_ERROR_DUMPFILE ${directory}/var/log/error-dump.json
    GA_DOMAIN_NAME destinet.eu
    DESTINET_NAVIGATION_KEYWORD nomenu
    GOOGLE_AUTH_CLIENT_ID ${secrets:GOOGLE_AUTH_CLIENT_ID}
    GOOGLE_AUTH_CLIENT_SECRET ${secrets:GOOGLE_AUTH_CLIENT_SECRET}
    GOOGLE_MAPS_API_KEY ${secrets:GOOGLE_MAPS_API_KEY}
    GOOGLE_GEOLOCATION_API_KEY ${secrets:GOOGLE_GEOLOCATION_API_KEY}
    GEOCODING_PROVIDER google
    SENTRY_DSN ${secrets:SENTRY_DSN}
    SENTRY_SITE destinet.eu
    SENTRY_RELEASE 4.4.3
    HEARTBEAT_HOST_NAME destinet.eu
    CHAMELEON_CACHE ${directory}/var/cache
storage = zeo
temporary-storage = zeo
zeo-client-cache-size = 128MB
zodb-cache-size = 10000
threads = 2
access-log-level = ERROR
scripts =
    heartbeat = Products.Naaya.views:heartbeat()
    mail-sender = repoze.sendmail.queue:run_console()

# var/filestorage/Data.fs, var/blobstorage and var/zeo.socket
[zeoserver]
pack-days = 7

[instance:zope-instance-0]
http-address = 16090

[instance:zope-instance-1]
http-address = 16091

[instance:zope-instance-2]
http-address = 16092

# Dedicated to the map ajax requests (/portal_map/xrjs_GeoClusters)
[instance:zope-instance-3]
http-address = 16093
zodb-cache-size = 20000

[instance:zope-instance-async]
http-address = 16095
zodb-cache-size = 20000

[instance:zope-instance-dev]
http-address = 16099
zodb-cache-size = 5000

# Own database, without ZEO
[instance:zope-instance-translations-test]
http-address = 16098
zodb-cache-size = 5000
storage = file
temporary-storage = local
file-storage = ${site:directory}/var/filestorage-translations-test/Data.fs
blob-storage = ${site:directory}/var/blobstorage-translations-test

[haproxy]
frontend-bind = 127.0.0.1:8080
frontend-backend = Zopes
backends =
    backend Zopes
        balance roundrobin
        option httpchk GET /health_check
        server Zope1 127.0.0.1:16090 check
        server Zope2 127.0.0.1:16091 check
        server Zope3 127.0.0.1:16092 check
